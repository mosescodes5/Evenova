<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-32.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08080f" />
    <meta name="description" content="Evenova — Professional event ticketing and management platform for Nigeria" />

    <!-- iOS "Add to Home Screen" support — Safari ignores the web manifest
         for install behavior and needs these explicit tags instead. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Evenova" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Evenova · Event Ticketing Platform</title>
    <style>
      html, body, #root { background: #08080f; margin: 0; padding: 0; }
      * { box-sizing: border-box; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Registers the installability service worker (see
      // public/service-worker.js — intentionally does no caching).
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/service-worker.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
